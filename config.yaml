user_agent: "job-finder/0.1 (personal job search, not a crawler)"
request_delay_seconds: 1.0
max_age_days: 3
keywords: [AI, automation, agent, LLM, forward deployed, solutions engineer]
location_allow: [philippines, apac, asia, asia-pacific, worldwide, anywhere, global]
score_threshold: 70
daily_call_cap: 300         # most model calls per day (UTC); more are refused and logged
allowed_hosts: [127.0.0.1, localhost]   # add your tunnel hostname here
aggregators: [himalayas, remoteok, wwr]
research: true              # true: one web-search call per target title (counts against daily_call_cap); false: off
research_max_age_days: 7    # research postings are asked for over the last 7 days
himalayas: {country: PH, timezone: "UTC+8", max_pages: 3}
# Resume (optional). Put your resume (PDF, DOCX, TXT or MD) in resume/, or run:
#   python -m jobfinder import-resume <file>
use_resume_keywords: true   # add the resume's search keywords to `keywords` (Himalayas searches them too)
max_resume_keywords: 6
tailor_resume: true         # a tailored .docx for each job that also gets a cover note draft
